# git-cliff: release notes and CHANGELOG.md from the PR titles on main.
# https://git-cliff.org/docs/configuration
#
# Each PR lands on main as one squashed commit, so one PR is one entry. Its title is
# user-facing text: say what changed for the person using Swarm.

[changelog]
header = """
# Changelog

Every release of Swarm. The newest is on top.\n
"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
postprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/DriesH/swarm/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# The comments set the order of the groups; the template strips them.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Faster" },
    { message = "^task", skip = true },
    { message = "^(chore|ci|build|docs|refactor|style|test)", skip = true },
]
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
