[package]
name = "swarm-menubar-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not part of any workspace.
[workspace]

[dependencies]
anyhow = "1"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flume = "0.12"
gpui = { git = "https://github.com/zed-industries/zed", rev = "70b1b91b73ee12930b4e3375d68657e9591b1921" }
# font-kit: without it GPUI renders no text on macOS.
# runtime_shaders: no Metal Toolchain needed to build.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "70b1b91b73ee12930b4e3375d68657e9591b1921", features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
# Same versions as gpui_macos at the pinned rev.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSValue",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }
raw-window-handle = "0.6"
# Same version gpui uses, so it is built once.
resvg = { version = "0.46", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

[features]
# PNG of the popover view (no screen-recording permission needed).
snapshot = ["gpui_platform/test-support"]

# Zed patches these crates in its own workspace; patches don't carry over to git deps.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
