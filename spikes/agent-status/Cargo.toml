# Standalone workspace: not part of any other workspace.
[workspace]
resolver = "3"
members = ["crates/proto", "crates/daemon", "crates/ctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
flume = "0.12"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proto = { path = "crates/proto" }
