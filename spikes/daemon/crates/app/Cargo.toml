[package]
name = "swarm-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
flume.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "70b1b91b73ee12930b4e3375d68657e9591b1921" }
# font-kit: without it GPUI renders no text on macOS (only logs a warning).
# runtime_shaders: compile Metal shaders at startup, so the build does not need the Metal Toolchain.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "70b1b91b73ee12930b4e3375d68657e9591b1921", features = ["font-kit", "runtime_shaders"] }
# Only for the `snapshot` feature (PNG of the rendered frame, no screen-recording permission needed).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libc = "0.2"
log = "0.4"
proto.workspace = true

[features]
snapshot = ["gpui_platform/test-support", "dep:image"]
