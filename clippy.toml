# Tunes how Clippy lints behave. Lint levels (allow/warn/deny) can't live here:
# they are in `[workspace.lints]` in Cargo.toml.

msrv = "1.98.1"

# Swarm is an app, not a published library: let Clippy suggest public API changes.
avoid-breaking-exported-api = false

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

too-many-lines-threshold = 120

doc-valid-idents = ["..", "GPUI", "AccessKit", "VoiceOver", "libghostty", "OSC", "PTY", "macOS"]

[[disallowed-methods]]
path = "std::thread::sleep"
reason = "Blocks the thread it runs on; in GPUI code this freezes the UI."
replacement = "cx.background_executor().timer(duration).await"
