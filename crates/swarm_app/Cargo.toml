[package]
name = "swarm_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "swarm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
swarm_layout.workspace = true
swarm_ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
# Saves rendered frames as PNGs (no screen-recording permission needed).
snapshot = ["gpui_platform/test-support", "dep:image"]
# Logs frame timings from a scripted session, or shows GPUI's live frame overlay.
frame-stats = ["gpui/profiler"]
