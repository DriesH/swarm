[package]
name = "swarm_app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "swarm-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
flume.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image.workspace = true
log.workspace = true
pulldown-cmark.workspace = true
swarm_layout.workspace = true
swarm_protocol.workspace = true
swarm_settings.workspace = true
swarm_term.workspace = true
swarm_term_view.workspace = true
swarm_ui.workspace = true

# The status item and the notification checks: AppKit and UserNotifications through objc2,
# the same versions gpui_macos builds. The icon is the bee SVG drawn by the resvg that gpui
# already builds.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { workspace = true, features = [
    "block2",
    "objc2-core-foundation",
    "NSAccessibilityProtocols",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSScreen",
    "NSSound",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSValue",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }
resvg = { version = "0.46", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
# Saves rendered frames as PNGs (no screen-recording permission needed).
snapshot = ["gpui_platform/test-support"]
# Logs frame timings from a scripted session, or shows GPUI's live frame overlay.
frame-stats = ["gpui/profiler"]
