[package]
name = "gallery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "swarm-gallery"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
swarm_term.workspace = true
swarm_term_view.workspace = true
swarm_term_vt.workspace = true
swarm_ui.workspace = true

[features]
# Saves rendered frames as PNGs (no screen-recording permission needed).
snapshot = ["gpui_platform/test-support", "dep:image"]
